<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – StudySync</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">

  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages/auth.css">
</head>
<body>
  <main class="auth-page">
    <a class="brand auth-brand" href="/">
      <img src="/assets/images/favicon.svg" alt="">
      StudySync
    </a>

    <div class="panel auth-card">
      <h1>Log in</h1>
      <p class="auth-subtitle">Welcome back. Enter your details to continue.</p>

      <div id="form-alert" class="alert d-none" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="login-email">Email address</label>
          <input class="form-control" type="email" id="login-email" name="email"
                 autocomplete="email" aria-describedby="login-email-error">
          <div class="invalid-feedback" id="login-email-error"></div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-control" type="password" id="login-password" name="password"
                 autocomplete="current-password" aria-describedby="login-password-error">
          <div class="invalid-feedback" id="login-password-error"></div>
        </div>

        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>

      <p class="auth-footer-text">New to StudySync? <a href="/register">Create an account</a></p>
    </div>

    <a class="auth-back" href="/">&larr; Back to home</a>
  </main>

  <script type="module" src="/assets/js/pages/login-page.js"></script>
</body>
</html>
